<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 'Instrument Sans',system-ui,sans-serif}

main{max-width:1280px;margin:0 auto;padding:22px 28px 60px}

.pnl{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}.pnl h3{font-size:16px;margin-bottom:12px}

.ins{margin:0;padding-left:18px}.ins li{margin-bottom:8px}

 <label>Nicho<input name="nicho" list="nl" value="${esc(l.nicho)}" placeholder="Ej: joyería, odontología"><datalist id="nl">${nic.map(n=>`<option>${esc(n)}`).join('')}</datalist></label>

 ${h.length?`<details open style="margin-top:12px"><summary><b>Historial</b></summary>${h.map(x=>`<div style="color:var(--mut)">${fd(x.d)} · ${esc(x.t)}</div>`).join('')}</details>`:''}
 <div class="acts"><span style="display:flex;gap:8px;flex-wrap:wrap">${o?'<button class="btn" type="button" id="del" style="color:#C0453F">Eliminar</button>':''}${waURL(l.wa)?`<a class="btn" target="_blank" rel="noopener" href="${waMsg(l)}">Abrir WhatsApp</a>`:''}${igURL(l.ig)?`<a class="btn" target="_blank" rel="noopener" href="${igURL(l.ig)}">Abrir Instagram</a>`:''}</span><span style="display:flex;gap:8px"><button class="btn" value="x">Cancelar</button><button class="btn pri" type="button" id="ok">${o?'Guardar':'Crear lead'}</button></span></div></form>`;
 d.showModal();const f=n=>d.querySelector('[name='+n+']'),vis=()=>{const e=f('estado').value;$('#lv').style.display=['propuesta','ganado'].includes(e)?'':'none';$('#lm').style.display=e==='perdido'?'':'none'};vis();

$('#bMany').onclick=()=>{const d=$('#dlg');d.innerHTML=`<form class="dlg" method="dialog"><h2>Pegar varios leads</h2><p style="margin-top:0">Una línea por lead, separado por comas: nombre, @instagram, teléfono o link, nicho, ciudad (el orden no importa para IG y WhatsApp). Se organizan solos. También puedes pegar aquí un JSON (lista de leads) y se crean solos.</p><textarea id="many" rows="9" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:8px"></textarea><div class="acts"><button class="btn" value="x">Cancelar</button><button class="btn pri" type="button" id="mk">Agregar</button></div></form>`;d.showModal();

  x.negocio=rest[0]||x.ig;x.nicho=rest[1]||'';x.ciudad=rest[2]||'';x.cat=autoCat(x.nicho);x.canal=x.wa?'WhatsApp':'Instagram';x.sig='Enviar primer mensaje.';log(x,'Lead creado');if(!x.negocio||dup(x)){s++;return}L.push(x);n++});

function normEst(v){const t=(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');if(ST[t])return t;if(/por confirmar/.test(t))return 'por_confirmar';if(/por enviar|pendiente/.test(t))return 'por_enviar';if(/respond|convers/.test(t))return 'conversacion';if(/propuesta/.test(t))return 'propuesta';if(/aplaz/.test(t))return 'aplazado';if(/gan|cerrad/.test(t))return 'ganado';if(/perd|descart/.test(t))return 'perdido';if(/envi/.test(t))return 'enviado';return 'por_enviar'}
function importJSONText(raw,d){let a;try{a=JSON.parse(raw)}catch(e){return toast('JSON no válido: revisa comas y comillas')}

 const pick=(o,ks)=>{for(const k of ks)if(o[k]!=null&&o[k]!=='')return String(o[k]).trim();return ''},dt=v=>{if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v;const m=v.toLowerCase().match(/^(\d{1,2})\s*(?:de\s*)?([a-zñ]{3})/);if(!m)return '';const i=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'].indexOf(m[2]);return i<0?'':new Date().getFullYear()+'-'+String(i+1).padStart(2,'0')+'-'+String(+m[1]).padStart(2,'0')};
 let n=0,s=0;a.forEach(o=>{if(!o||typeof o!=='object'){s++;return}

  x.notas=pick(o,['notas','notes']);x.sig=pick(o,['sig','siguiente','siguiente_paso'])||'Enviar primer mensaje.';x.msg=pick(o,['msg','mensaje']);x.variante=pick(o,['variante']);
  x.estado=normEst(pick(o,['estado','status']));x.envio=dt(pick(o,['envio','ultimo_mensaje']));x.prox=dt(pick(o,['prox','seguimiento','proximo_seguimiento']));

 save();if(d)d.close();render();toast(n+' agregados'+(s?', '+s+' omitidos (repetidos o vacíos)':''))}

 if(ac.length)G.push(['Acciones',ac.map(x=>({a:x[0],t:x[1],s:'',go:x[2]}))]);
 if(ql&&ls.length)G.push(['',[{a:'↗',t:'Ver todos los resultados en Leads',s:'«'+esc(q)+'»',go:()=>{F.q=q;F.e='';F.c='';view='t';render()}}]]);
 palItems=[];$('#pr').innerHTML=G.map(([t,a])=>(t?`<div class="pg">${t}</div>`:'')+a.map(x=>{palItems.push(x);return `<div class="pi" data-pi="${palItems.length-1}"><span class="av sm">${x.a}</span><div><b>${x.t}</b>${x.s?`<small>${x.s}</small>`:''}</div></div>`}).join('')).join('')||'<p class="empty">Sin resultados.</p>';
 palI=0;palPaint();document.querySelectorAll('.pi').forEach(el=>{el.onclick=()=>palGo(+el.dataset.pi);el.onmousemove=()=>{palI=+el.dataset.pi;palPaint()}})}

/* ---------- Conexión Supabase (sin respaldos locales) ---------- */
$('#bSet').onclick=()=>{const d=$('#dlg');d.innerHTML=`<form class="dlg" method="dialog"><h2>Conexión Supabase</h2><p style="margin-top:0;color:var(--mut)">Tus leads y reuniones viven solo en Supabase: no se guardan en este navegador. Cada cambio se envía en segundos y la pantalla se refresca sola cada minuto.</p><div class="f"><label class="w">Project URL<input id="su" placeholder="https://xxxx.supabase.co" value="${esc(cfg.url)}"></label><label class="w">Anon public key<input id="sk" value="${esc(cfg.key)}"></label></div><div class="acts" style="justify-content:flex-start"><button class="btn pri" type="button" id="s1">Guardar conexión</button><button class="btn" type="button" id="s3">Recargar desde Supabase</button><button class="btn" value="cancel">Cerrar</button></div></form>`;d.showModal();
 const sv=()=>{cfg.url=$('#su').value.trim();cfg.key=$('#sk').value.trim();saveCfg();shellRender()};$('#s1').onclick=()=>{sv();d.close();pull()};$('#s3').onclick=()=>{sv();pull()}};
/* ---------- Recordatorios al celular (Gmail, vía Google Apps Script gratis) ---------- */
const GS=String.raw`const SUPABASE_URL = '__URL__';
const SUPABASE_KEY = '__KEY__';
const ZONA = 'America/Bogota';

function revisar() {
  const res = UrlFetchApp.fetch(SUPABASE_URL + '/rest/v1/leads?select=id,data', {
    headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY },
    muteHttpExceptions: true
  });
  if (res.getResponseCode() !== 200) { console.error(res.getContentText()); return; }
  const props = PropertiesService.getScriptProperties();
  const yo = Session.getEffectiveUser().getEmail();
  const ahora = new Date();
  JSON.parse(res.getContentText()).forEach(function (row) {
    const l = row.data || {};
    (l.reuniones || []).forEach(function (m) {
      if (m.done || !m.f || !m.h) return;
      const inicio = Utilities.parseDate(m.f + ' ' + m.h, ZONA, 'yyyy-MM-dd HH:mm');
      const faltan = (inicio - ahora) / 60000;
      const clave = 'r_' + m.id + '_' + m.f + '_' + m.h;
      if (faltan > 0 && faltan <= (Number(m.rem) || 30) && !props.getProperty(clave)) {
        const wa = l.wa ? '\nWhatsApp: https://wa.me/' + String(l.wa).replace(/\D/g, '') : '';
        GmailApp.sendEmail(yo, 'En ' + Math.round(faltan) + ' min: ' + (m.t || 'Reunión') + ' con ' + l.negocio,
          m.h + ' · ' + (m.t || 'Reunión') + '\nLead: ' + l.negocio + (m.lugar ? '\nLugar o link: ' + m.lugar : '') + (m.nota ? '\nNotas: ' + m.nota : '') + wa);
        props.setProperty(clave, '1');
      }
    });
  });
}

function instalar() {
  ScriptApp.getProjectTriggers().forEach(function (t) { ScriptApp.deleteTrigger(t); });
  ScriptApp.newTrigger('revisar').timeBased().everyMinutes(5).create();
}

function probar() {
  GmailApp.sendEmail(Session.getEffectiveUser().getEmail(), 'Prueba del CRM', 'Si ves esto en tu celular, los avisos funcionan.');
}`;
$('#bRem').onclick=()=>{const d=$('#dlg'),code=GS.replace('__URL__',cfg.url||'https://TU-PROYECTO.supabase.co').replace('__KEY__',cfg.key||'TU_ANON_KEY');
 d.innerHTML=`<form class="dlg" method="dialog"><h2>Recordatorios al celular</h2><p style="margin-top:0;color:var(--mut)">Un script gratis de Google lee tus reuniones desde Supabase cada 5 minutos y te manda un correo a tu Gmail antes de cada reunión (el tiempo que elegiste al agendarla).</p>
 <ol class="stp"><li>Entra a <b>script.google.com</b> → <b>Nuevo proyecto</b>.</li><li>Borra lo que haya y pega el código de abajo. Guarda.</li><li>Arriba elige la función <b>probar</b> → <b>Ejecutar</b>. Acepta los permisos (pantalla «no verificada» → Avanzado → Continuar). Debe llegarte un correo de prueba.</li><li>Elige la función <b>instalar</b> → <b>Ejecutar</b>. Listo, queda corriendo solo.</li><li>En la app de Gmail de tu celular, deja activadas las notificaciones de todos los correos.</li></ol>
 <textarea class="rcode" readonly id="rc">${esc(code)}</textarea><div class="acts" style="justify-content:flex-start"><button class="btn pri" type="button" id="rcp">Copiar código</button><button class="btn" value="cancel">Cerrar</button></div></form>`;d.showModal();
 $('#rcp').onclick=()=>navigator.clipboard.writeText(code).then(()=>toast('Código copiado'))};
/* ---------- Avisos con la pestaña abierta ---------- */
function notifyMeet(){const now=Date.now();meets().forEach(({l,m})=>{if(m.done)return;const mins=(mStart(m)-now)/6e4,k='leads_mn_'+m.id+m.f+m.h;if(mins>0&&mins<=(+m.rem||30)){let s='';try{s=localStorage.getItem(k)}catch(e){}if(s)return;try{localStorage.setItem(k,'1')}catch(e){}toast('⏰ En '+Math.round(mins)+' min: '+m.t+' · '+l.negocio);if('Notification' in window&&Notification.permission==='granted')new Notification('Reunión en '+Math.round(mins)+' min',{body:m.t+' · '+l.negocio})}})}
function notifyDue(){if(!('Notification' in window)||Notification.permission!=='granted')return;const n=L.filter(due).length,k='leads_notif_'+today();let seen='';try{seen=localStorage.getItem(k)||''}catch(e){}
 if(n&&seen!==String(n)){new Notification('Seguimientos pendientes',{body:n+(n===1?' lead toca':' leads tocan')+' escribirse hoy'});try{localStorage.setItem(k,String(n))}catch(e){}}}
$('#bNot').onclick=async()=>{if(!('Notification' in window))return toast('Tu navegador no soporta avisos');const p=await Notification.requestPermission();toast(p==='granted'?'Avisos activados (con la pestaña abierta)':'Avisos bloqueados en el navegador');notifyDue()};
/* ===== MODO SUPABASE DIRECTO: los leads NO se guardan en el navegador ===== */
let SB_READY=false,SB_LAST=new Map(),SB_DIRTY=false;
async function flushDel(){}
function save(){SB_DIRTY=true;clearTimeout(tm);tm=setTimeout(syncNow,700)}
async function syncNow(){
 if(!cfg.url||!cfg.key||!SB_READY)return;
 const cur=new Map(L.map(l=>[l.id,JSON.stringify(l)])),up=L.filter(l=>SB_LAST.get(l.id)!==cur.get(l.id)),del=[...SB_LAST.keys()].filter(id=>!cur.has(id));
 if(!up.length&&!del.length){SB_DIRTY=false;return}
 try{
  if(up.length){const r=await sb('leads?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates'},body:JSON.stringify(up.map(l=>({id:l.id,data:l,updated_at:new Date().toISOString()})))});if(!r.ok)throw new Error(await r.text())}
  for(const id of del){const r=await sb('leads?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:{Prefer:'return=representation'}});if(!r.ok)throw new Error(await r.text());const rw=await r.json();if(!rw.length){toast('Supabase no dejó borrar: falta la política de borrado (DELETE)');return}}
  SB_LAST=cur;SB_DIRTY=false}
 catch(e){toast('No se pudo guardar en Supabase: '+e.message.slice(0,70))}}
async function sbLoad(first){
 try{const r=await sb('leads?select=id,data');if(!r.ok)throw new Error(await r.text());const rows=await r.json();
  L=rows.filter(x=>x.data).map(x=>({...x.data,id:x.data.id||x.id}));L.forEach(l=>{l.ig=normIG(l.ig);l.hist=l.hist||[]});
  SB_LAST=new Map(L.map(l=>[l.id,JSON.stringify(l)]));SB_READY=true;SB_DIRTY=false;render()}
 catch(e){toast('No se pudo cargar de Supabase: '+e.message.slice(0,70));if(first){L=[];render()}}}
async function pull(){await sbLoad(false);toast(L.length+' leads cargados de Supabase')}
async function push(){await syncNow()}
async function load(){
 try{cfg={...cfg,...JSON.parse(localStorage.getItem(LSS)||'{}')}}catch(e){}
 if(!cfg.url||!cfg.key){L=[];render();toast('Conecta Supabase para ver tus leads');setTimeout(()=>$('#bSet').click(),500);return}
 await sbLoad(true)}
window.addEventListener('beforeunload',e=>{if(SB_DIRTY){e.preventDefault();e.returnValue=''}});
const idle=()=>!$('#dlg').open&&!($('#pal')&&$('#pal').open)&&!(document.activeElement&&['q','fe','fc','pq'].includes(document.activeElement.id));
setInterval(()=>{if(SB_DIRTY)syncNow();else if(idle())sbLoad(false);notifyDue();notifyMeet()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&idle()){if(SB_DIRTY)syncNow();else sbLoad(false);notifyDue();notifyMeet()}});
$('#bUndo').onclick=undo;
$('#bTheme').onclick=()=>{const d=document.documentElement.classList.toggle('dark');try{localStorage.setItem('leads_theme',d?'dark':'light')}catch(e){}shellRender()};
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase(),typing=/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'');
 if((e.ctrlKey||e.metaKey)&&k==='k'){e.preventDefault();openPal()}
 else if(k==='/'&&!typing&&!e.ctrlKey&&!$('#dlg').open){e.preventDefault();openPal()}
 else if((e.ctrlKey||e.metaKey)&&k==='z'&&!typing){e.preventDefault();undo()}});
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
setTimeout(notifyDue,1500);setTimeout(notifyMeet,2000);
load();
