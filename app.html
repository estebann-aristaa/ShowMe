 $('#e1').onclick=exportJSON;$('#e2').onclick=()=>$('#fi').click();$('#fi').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const a=JSON.parse(t);if(!Array.isArray(a))throw 0;const m=new Map(L.map(l=>[l.id,l]));a.forEach(l=>m.set(l.id||crypto.randomUUID(),{...l,id:l.id||crypto.randomUUID()}));L=[...m.values()];save();render();toast('Importados '+a.length+' leads')}catch(x){toast('Archivo no válido')}})};
 const sv=()=>{cfg.url=$('#su').value.trim();cfg.key=$('#sk').value.trim();saveCfg()};$('#s1').onclick=()=>{sv();toast('Conexión guardada')};$('#s2').onclick=()=>{sv();push()};$('#s3').onclick=()=>{sv();pull()}};
load();
